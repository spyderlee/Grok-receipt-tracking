[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    mysql: needs a reachable MySQL/MariaDB test database (see tests/setup_test_db.sh)
    tesseract: needs the tesseract binary
# audit N13: a leaked socket / event loop fails the test that leaked it
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
